version: "3"
name: pagopa-interop-kpi
services:
  postgres:
    container_name: postgres
    volumes:
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    ports:
      - 55000:5432
    environment:
      POSTGRES_DB: interop-kpi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: -c 'max_connections=512' -c 'wal_level=logical'

  # RustFS is a local S3-compatible storage, to replace AWS S3 in local development
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      RUSTFS_ACCESS_KEY: testawskey # use this as AWS S3 access key ID
      RUSTFS_SECRET_KEY: testawssecret # use this as AWS S3 secret access key
      RUSTFS_REGION: eu-south-1
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./rustfs-data:/data
    restart: always

  # Seed the buckets that were created implicitly by MinIO's directory layout.
  rustfs-seed:
    image: amazon/aws-cli:2.17.44
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: testawskey
      AWS_SECRET_ACCESS_KEY: testawssecret
      AWS_REGION: eu-south-1
      AWS_DEFAULT_REGION: eu-south-1
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://rustfs:9000 s3 ls; do
          echo 'Waiting for RustFS to be ready...';
          sleep 1;
        done;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-local-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://application-audit-archiver || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://alblogs || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-jwt-audit-analytics-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-jwt-audit-analytics-copy-bucket || true;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://interop-application-audit-analytics-copy-bucket || true;
      "

  elasticmq: # ElasticMQ is a local SQS-compatible queue system, to replace AWS SQS in local development
    container_name: elasticmq
    image: softwaremill/elasticmq-native:1.5.7
    ports:
      - 9324:9324
      - 9325:9325
    volumes:
      - ./elasticmq/elasticmq.local.conf:/opt/elasticmq.conf
    restart: always

  zookeeper:
    image: quay.io/debezium/zookeeper:2.3@sha256:5b1354c4fa3bae600128eaa3ba9487ebd98b0aef40e3a39b32efe7533c8d2604

  kafka:
    image: quay.io/debezium/kafka:2.3@sha256:4009c39c2cc42686d1b5f0d2c46b3ff166e6ea98fb9a61d925b90f7fc56358e0
    ports:
      - 9092:9092
      - 29092:29092
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: LISTENER_DOCKER://kafka:29092,LISTENER_HOST://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER://kafka:29092,LISTENER_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER:PLAINTEXT,LISTENER_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:53a6553765a806eda9905c43bfcfe09da6812035@sha256:7317d08c1d58f1c7e67adb936e3b181151bd5534a30b761f75fe8bddbf079ffd
    ports:
      - 8084:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

networks:
  develop-network:
    name: interop-kpi-develop-network
    driver: bridge
